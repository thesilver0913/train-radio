name: Build & Release

# v* のタグを push すると Releases に載せる。手動実行(workflow_dispatch)はビルド成果物(Artifacts)のみ
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Version
        shell: bash
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.0-dev)" >> $GITHUB_ENV

      - name: Server exe (Node SEA)
        run: |
          npm ci
          npm run build:server

      - name: Client exe (Tauri)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle
          Copy-Item src-tauri\target\release\TrainRadio.exe ..\dist\

      - name: Installer (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyVersion=$env:VERSION installer\TrainRadio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TrainRadio-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
