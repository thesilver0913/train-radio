name: Build & Release

# v* のタグを push すると Releases に載せる。手動実行(workflow_dispatch)はビルド成果物(Artifacts)のみ
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Version
        shell: bash
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.0-dev)" >> $GITHUB_ENV

      - name: Server exe (Node SEA)
        run: |
          npm ci
          npm run build:server

      - name: Client exe (Tauri)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle
          Copy-Item src-tauri\target\release\TrainRadio.exe ..\dist\

      - name: Installer (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyVersion=$env:VERSION installer\TrainRadio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TrainRadio-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }

      - name: Version
        run: echo "VERSION=$([[ $GITHUB_REF == refs/tags/v* ]] && echo ${GITHUB_REF_NAME#v} || echo 0.0.0-dev)" >> $GITHUB_ENV

      - name: APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node android/sync-assets.js
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" VERSION_NAME="$VERSION" gradle -p android assembleRelease --no-daemon
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/TrainRadio-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
