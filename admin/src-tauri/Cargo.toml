[package]
name = "train-radio-server"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "TrainRadioServer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
