<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>列車無線</title>
<link rel="stylesheet" href="vendor/carbon.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/carbon.js"></script>
</head>
<body>
<main id="login" class="view">
  <form id="loginForm" autocomplete="off">
    <h1>列車無線</h1>
    <cds-select id="fCh" label-text="チャンネル">
      <cds-select-item value="2">2ch(下電)</cds-select-item>
      <cds-select-item value="80">80ch(南北線)</cds-select-item>
      <cds-select-item value="81">81ch(東西線)</cds-select-item>
      <cds-select-item value="85">85ch(非常用)</cds-select-item>
    </cds-select>
    <cds-text-input id="fNo" label="列車番号" maxlength="6" placeholder="例 6110 / 501C" autocomplete="off"></cds-text-input>
    <cds-select id="fVeh" label-text="車種">
      <cds-select-item value="shimoden">下電車</cds-select-item>
      <cds-select-item value="chikatetsu">地下鉄車</cds-select-item>
    </cds-select>
    <cds-password-input id="fPw" label="指令パスワード" hidden></cds-password-input>
    <cds-text-input id="fSrv" label="サーバー" placeholder="例 http://192.168.0.10:8080" autocomplete="off"></cds-text-input>
    <cds-button id="fGo" kind="primary" size="lg">接続</cds-button>
    <p id="loginMsg" role="status"></p>
  </form>
</main>

<main id="train" class="view" hidden>
  <div id="radioWrap">
    <div id="radio" style="--s:1">
      <img class="layer" src="img/base.png" alt="" draggable="false">
      <canvas id="seg" class="layer" width="254" height="605"></canvas>
      <img id="lPower" class="layer lamp" src="img/power.png" alt="" draggable="false">
      <img id="lBusy" class="layer lamp" src="img/busy.png" alt="" draggable="false">
      <img id="lGuard" class="layer lamp" src="img/guard.png" alt="" draggable="false">
      <img id="lTest" class="layer lamp" src="img/test.png" alt="" draggable="false">
      <div id="hsOverlay" style="--x:112;--y:38;--w:132;--h:502"></div>
      <button class="zone" id="zHandset" aria-label="受話器(指令呼出)" style="--x:112;--y:38;--w:132;--h:502"></button>
      <button class="zone" id="zGuard" aria-label="防護発報" style="--x:32;--y:44;--w:56;--h:58"></button>
      <button class="zone" id="zTest" aria-label="試験" style="--x:38;--y:268;--w:44;--h:31"></button>
      <button class="zone" id="zVup" aria-label="音量+" style="--x:132;--y:177;--w:34;--h:22"></button>
      <button class="zone" id="zVdn" aria-label="音量-" style="--x:188;--y:177;--w:34;--h:22"></button>
    </div>
  </div>
  <div class="tbar">
    <div id="trainInfo"></div>
    <button id="ptt" class="ptt">送話</button>
    <cds-button id="btnSettings" kind="ghost" size="lg">設定</cds-button>
  </div>
</main>

<main id="disp" class="view" hidden>
  <header class="dbar">
    <div class="dtitle"><h1 id="dCh"></h1><span id="dMeta"></span></div>
    <div class="dctl">
      <cds-button id="dBc" kind="primary" size="md">一斉通話 開始</cds-button>
      <cds-button id="dMute" kind="secondary" size="md">ミュート</cds-button>
      <cds-button id="dHold" kind="secondary" size="md">保留音</cds-button>
      <cds-button id="dLeave" kind="secondary" size="md">退出</cds-button>
    </div>
    <div class="dstat">
      <cds-tag id="dMic" type="gray" size="md">待機</cds-tag>
      <cds-tag id="dBusy" type="gray" size="md">話中</cds-tag>
      <cds-tag id="dTest" type="gray" size="md">試験信号</cds-tag>
      <cds-tag id="dGuardPill" type="gray" size="md">防護発報</cds-tag>
    </div>
    <div class="dmenu">
      <cds-button id="dDetail" kind="ghost" size="md">詳細設定</cds-button>
      <cds-button id="dSettings" kind="ghost" size="md">設定</cds-button>
    </div>
  </header>
  <cds-tabs id="dTabs" value="calls" class="dtabs">
    <cds-tab id="dTabCalls" value="calls">通話</cds-tab>
    <cds-tab id="dTabSt" value="st">移動局</cds-tab>
  </cds-tabs>
  <div class="dgrid">
    <section class="panel"><h2>通話</h2><div id="dCalls"></div></section>
    <section class="panel">
      <h2>接続列車</h2>
      <div id="dCallForm">
        <cds-text-input id="dCallNo" label="列車番号" hide-label maxlength="6" placeholder="列車番号" size="md"></cds-text-input>
        <cds-button id="dCallGo" kind="tertiary" size="md">個別呼出</cds-button>
      </div>
      <div id="dTrains"></div>
    </section>
    <section class="panel"><h2>防護発報</h2><div id="dGuards"></div></section>
  </div>
  <section id="dSt" class="panel dst" hidden><h2>移動局</h2><div id="dStations"></div></section>
</main>

<cds-modal id="modal" size="sm">
  <cds-modal-header><cds-modal-close-button></cds-modal-close-button><cds-modal-heading id="mTitle"></cds-modal-heading></cds-modal-header>
  <cds-modal-body id="mBody"></cds-modal-body>
</cds-modal>
<div id="conn" hidden>再接続中</div>
<div id="toasts"></div>
<script src="segdata.js"></script>
<script src="platform.js"></script>
<script src="vendor/update.js"></script>
<script src="adpcm.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
